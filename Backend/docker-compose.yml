services:
  postgres:
    image: postgres:16-alpine
    container_name: moodfood-postgres
    environment:
      POSTGRES_DB: moodfood
      POSTGRES_USER: moodfood
      POSTGRES_PASSWORD: moodfood_dev
    ports:
      - "5434:5432"
    volumes:
      - moodfood_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodfood"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: moodfood-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Inside Docker, connect via service name "postgres", port 5432 (internal)
      DATABASE_URL: postgresql://moodfood:moodfood_dev@postgres:5432/moodfood?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_URL: ${APP_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@moodfood.app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  moodfood_data:
