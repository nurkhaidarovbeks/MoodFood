global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Локальная разработка — backend на хосте (npm run dev)
  - job_name: moodfood-local
    static_configs:
      - targets:
          - host.docker.internal:3000
    metrics_path: /metrics

  # Продакшн на Render — скрейпим тот же /metrics эндпоинт
  - job_name: moodfood-render
    static_configs:
      - targets:
          - moodfood-backend.onrender.com
    metrics_path: /metrics
    scheme: https
