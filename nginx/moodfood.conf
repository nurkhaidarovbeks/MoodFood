# MoodFood — Nginx reverse proxy config
# Place at: /etc/nginx/sites-available/moodfood
# Enable with: sudo ln -s /etc/nginx/sites-available/moodfood /etc/nginx/sites-enabled/
# Test with:   sudo nginx -t
# Reload with: sudo systemctl reload nginx
#
# After setting up domain, run Certbot to add HTTPS:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Proxy all traffic to the Node.js backend
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass real client info to Node.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# After running Certbot, it will automatically add the HTTPS block below.
# Certbot command:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# Verify auto-renewal:
#   sudo certbot renew --dry-run
